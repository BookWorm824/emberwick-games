<script>(function () {
  var errors = [];

  addEventListener('error', function (e) { note((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
  addEventListener('unhandledrejection', function (e) { note('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
  var TITLE = "Saltwind Ledger", TO = "", BUILD = "2026-10-21 21:55";
  // a picture of the game: read inside one of its own animation frames, while the drawing is still there
  function picture(done) {
    var c = [].slice.call(document.querySelectorAll('canvas')).sort(function (a, b) { return b.width * b.height - a.width * a.height; })[0];
    if (!c) return done('');
    // a page that is not drawing (hidden, or the game stopped) has no next frame: the window opens without a picture
    // (then the canvas is read straight away, which works for a game drawn without WebGL; an empty picture is left out)
    var sent = false, once = function (p) { if (!sent) { sent = true; done(p); } };
    function grab() {
      try {
        var s = Math.min(1, 1280 / Math.max(c.width, c.height)), o = document.createElement('canvas'); o.width = Math.round(c.width * s); o.height = Math.round(c.height * s);
        var g = o.getContext('2d'); g.drawImage(c, 0, 0, o.width, o.height);

        for (var i = 0; i < px.length; i += 4 * 97) if (px[i] + px[i + 1] + px[i + 2] > 24) lit++;
        return lit ? o.toDataURL('image/jpeg', 0.8) : '';
      } catch (e) { return ''; }
    }
    setTimeout(function () { once(grab()); }, 400);
    requestAnimationFrame(function () { once(grab()); });
  }
  window.emberwickReport = function () {
    if (document.getElementById('ew-report')) return;
    picture(function (pic) {
      var box = document.createElement('div'); box.id = 'ew-report';
      box.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:rgba(5,7,11,.72);font:15px system-ui,sans-serif;color:#e9ecf2';
      box.innerHTML = '<form style="width:min(92vw,460px);background:#141821;border:1px solid #2b3240;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">'
        + '<strong style="font-size:18px">Report a problem</strong><span style="color:#909aac">What happened, and what were you doing just before? A picture of the screen goes along.</span>'
        + '<textarea rows="5" required style="background:#0d1016;color:#e9ecf2;border:1px solid #2b3240;border-radius:8px;padding:9px;font:inherit;resize:vertical"></textarea>'
        + (pic ? '<label style="display:flex;gap:8px;align-items:center;color:#909aac"><input type="checkbox" checked> Send the picture of the screen</label>' : '')
        + '<div style="display:flex;gap:8px;justify-content:flex-end;align-items:center"><span data-say style="color:#909aac;margin-right:auto"></span><button type="button" style="background:transparent;border:1px solid #2b3240;border-radius:8px;padding:9px 14px;color:#e9ecf2;font:inherit;cursor:pointer">Cancel</button><button style="background:#ff8a5c;color:#1c0f08;border:0;border-radius:8px;padding:9px 16px;font:600 15px system-ui,sans-serif;cursor:pointer">Send</button></div></form>';
      // the game must not take the typing as its own controls
      ['keydown', 'keyup', 'keypress', 'pointerdown', 'mousedown', 'touchstart', 'wheel'].forEach(function (t) { box.addEventListener(t, function (e) { e.stopPropagation(); }); });
      document.body.appendChild(box);
      var text = box.querySelector('textarea'), say = box.querySelector('[data-say]'), keep = box.querySelector('input');
      text.focus();
      box.querySelector('button[type=button]').onclick = function () { box.remove(); };
      box.querySelector('form').onsubmit = function (e) {
        e.preventDefault();
        var words = text.value.trim(); if (!words) return;
        var info = { text: words, kind: 'problem', by: window.__emberwickTester || '', where: location.pathname + location.search, build: BUILD,
          device: navigator.userAgent + ' · screen ' + screen.width + 'x' + screen.height + ' · window ' + innerWidth + 'x' + innerHeight, errors: errors.slice(), picture: keep && keep.checked ? pic : '' };
        say.textContent = 'Sending…';
        fetch('/__emberwick/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(info) }).then(function (r) {
          if (!r.ok) throw new Error('not a test link');
          say.textContent = 'Sent. Thank you!'; setTimeout(function () { box.remove(); }, 1200);
        }).catch(function () {
          // not on a test link: the report goes by email instead, written out
          var body = words + '\n\n--\n' + TITLE + ', built ' + BUILD + '\n' + info.device + (errors.length ? '\n\nWhat went wrong in the game:\n' + errors.join('\n') : '') + (info.picture ? '\n\n(Please add a screenshot if you can.)' : '');
          location.href = 'mailto:' + encodeURIComponent(TO) + '?subject=' + encodeURIComponent('Problem in ' + TITLE) + '&body=' + encodeURIComponent(body);
          say.textContent = TO ? 'Your email app opens with the report written out. Press Send there.' : 'Your email app opens with the report written out.';
        });
      };
    });
  };
})();</script>
<script>(function () {
// The Emberwick Games intro: the studio logo, animated, shown when a game starts.
// The flame rises and flickers, embers drift up, the name is revealed from the middle with a shine passing over it, and

//
// It is plain HTML and CSS laid over the game, so it needs nothing from the game's own code. The builder's preview

    + '#ew-intro{position:fixed;inset:0;z-index:100;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;'

    + '#ew-intro.ew-out{opacity:0}'
    + '#ew-intro:not(.ew-go) *{animation-play-state:paused!important}'   // the screen is covered at once; the animation waits for the logo
    + '#ew-intro .ew-box{position:relative;width:min(74vw,112vh,820px);aspect-ratio:3/2}'
    + '#ew-intro img,#ew-intro .ew-shine{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}'
    + '#ew-intro .ew-glow{position:absolute;left:50%;top:31%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.3);border-radius:50%;opacity:0;'
    + 'background:radial-gradient(circle,rgba(255,150,40,.42) 0%,rgba(255,90,10,.16) 38%,rgba(255,90,10,0) 66%);animation:ew-glow 1.3s .25s ease-out forwards,ew-pulse 2.1s 1.6s ease-in-out infinite}'

    + '#ew-intro .ew-shine{clip-path:' + NAME + ';-webkit-mask:url("' + logo + '") center/100% 100% no-repeat;mask:url("' + logo + '") center/100% 100% no-repeat;'
    + 'background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 58%) no-repeat;background-size:260% 100%;background-position:130% 0;animation:ew-shine 1.1s 2.15s ease-in-out forwards}'

    + '#ew-intro .ew-skip{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;color:rgba(254,244,216,.38);font:12px system-ui,sans-serif;letter-spacing:.06em;opacity:0;animation:ew-fade .8s 2.4s forwards}'
    + '@keyframes ew-rise{0%{opacity:0;transform:translateY(7%) scale(.5,.18)}45%{opacity:1}70%{transform:translateY(0) scale(1.05,1.09)}100%{opacity:1;transform:none}}'

  var root = document.createElement('div');

    var e = document.createElement('span'), size = 2 + Math.random() * 4.5;
    e.className = 'ew-ember';

<script>(function () {
  var box = document.getElementById('ew-loading'), bar = document.getElementById('ew-bar'), note = document.getElementById('ew-note');
  var BUILD = "1792619742850", KEY = 'emberwick:ready:' + "ship-trading-game", before = null;
  try { before = localStorage.getItem(KEY); } catch (e) {}
  if (before === BUILD) document.getElementById('ew-what').innerHTML = "Starting <b>Saltwind Ledger</b>";
  else if (before) document.getElementById('ew-what').innerHTML = "Installing the update for <b>Saltwind Ledger</b>";
  var total = 0, seen = {}, count = 0, last = 0;
  try { performance.setResourceTimingBufferSize(3000); } catch (e) {}
  fetch('assets/manifest.json').then(function (r) { return r.json(); }).then(function (list) { total = list.filter(function (a) { return a && a.file; }).length; }).catch(function () {});
  function done() { clearInterval(timer); if (box) { box.remove(); box = null; } try { localStorage.setItem(KEY, BUILD); } catch (e) {} }
  var timer = setInterval(function () {
    performance.getEntriesByType('resource').forEach(function (r) {
      if (r.name.indexOf('/assets/') < 0 || /manifest\.json|\.js(\?|$)/.test(r.name) || seen[r.name]) return;
      seen[r.name] = 1; count++; last = Date.now();

    if (!last && document.querySelector('canvas')) last = Date.now();
    var quiet = last ? Date.now() - last : 0;

      var p = Math.min(100, Math.round(count / total * 100));
      bar.style.width = Math.max(2, p) + '%';
      note.textContent = p + '%';
      if (count >= total) return setTimeout(done, 300);
    }
    // nothing to count, or the game loads its files some other way: step aside once it has clearly started
    if (quiet > (total ? 30000 : 2500)) done();
  }, 250);
})();</script>
